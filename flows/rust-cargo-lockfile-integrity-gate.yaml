id: rust-cargo-lockfile-integrity-gate
namespace: company.supplychain
description: |
  Audit a public Rust repository's Cargo.toml and Cargo.lock before building or releasing it. The flow
  checks root package identity consistency, lockfile format, registry package checksum completeness,
  checksum shape, insecure registry source URLs, and Git dependency revision pinning. It creates a
  machine-readable report, can archive evidence to S3, and blocks downstream promotion when configured
  checks fail. This audit validates checksum metadata and immutable references but does not download
  crate archives or recompute package bytes against each checksum.

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository
    defaults: BurntSushi/ripgrep
    description: Public GitHub repository in owner/name format.
  - id: default_branch
    type: STRING
    displayName: Branch or ref
    defaults: master
    description: Branch or tag containing Cargo.toml and Cargo.lock.
  - id: manifest_path
    type: STRING
    displayName: Cargo.toml path
    defaults: Cargo.toml
    description: Repository-relative manifest path.
  - id: lockfile_path
    type: STRING
    displayName: Cargo.lock path
    defaults: Cargo.lock
    description: Repository-relative Cargo lockfile path.
  - id: minimum_lockfile_version
    type: INT
    displayName: Minimum lockfile version
    defaults: 3
    description: Minimum Cargo lockfile format version accepted by policy.
  - id: require_registry_checksums
    type: BOOL
    displayName: Require registry checksums
    defaults: true
    description: Block registry-sourced packages that lack a SHA-256 checksum or provide a malformed checksum.
  - id: require_https_registry
    type: BOOL
    displayName: Require HTTPS registries
    defaults: true
    description: Block registry sources that use cleartext HTTP.
  - id: require_immutable_git_refs
    type: BOOL
    displayName: Require immutable Git refs
    defaults: true
    description: Block Git dependencies without a full 40- or 64-character commit SHA in their source.
  - id: minimum_package_count
    type: INT
    displayName: Minimum package count
    defaults: 1
    description: Minimum number of package records required in Cargo.lock.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the generated JSON audit report in S3. AWS secrets are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: Evidence bucket
    defaults: my-supply-chain-evidence
    description: Existing S3 bucket used when archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: Evidence prefix
    defaults: cargo-lockfile-integrity
    description: Prefix for Cargo lockfile reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region of the evidence bucket.

triggers:
  - id: weekly_cargo_lockfile_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck package lock metadata weekly. Enable after the initial run is reviewed and alert secrets are configured.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the repository, ref, paths and policy thresholds before fetching source files.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      REPOSITORY: "{{ inputs.repository }}"
      DEFAULT_BRANCH: "{{ inputs.default_branch }}"
      MANIFEST_PATH: "{{ inputs.manifest_path }}"
      LOCKFILE_PATH: "{{ inputs.lockfile_path }}"
      MINIMUM_LOCKFILE_VERSION: "{{ inputs.minimum_lockfile_version }}"
      MINIMUM_PACKAGE_COUNT: "{{ inputs.minimum_package_count }}"
    script: |
      import os
      import re

      repository = os.environ.get("REPOSITORY", "").strip()
      ref = os.environ.get("DEFAULT_BRANCH", "").strip()
      paths = (
          os.environ.get("MANIFEST_PATH", "").strip(),
          os.environ.get("LOCKFILE_PATH", "").strip(),
      )
      minimum_version = int(os.environ.get("MINIMUM_LOCKFILE_VERSION", "3"))
      minimum_packages = int(os.environ.get("MINIMUM_PACKAGE_COUNT", "1"))

      if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
          raise ValueError("repository must be a public GitHub owner/name pair")
      if not ref or any(char in ref for char in "\r\n"):
          raise ValueError("default_branch must be a non-empty single-line ref")
      for path in paths:
          if not path or path.startswith("/") or ".." in path.split("/"):
              raise ValueError("manifest_path and lockfile_path must be repository-relative paths")
      if minimum_version < 3:
          raise ValueError("minimum_lockfile_version must be 3 or greater")
      if minimum_packages < 0:
          raise ValueError("minimum_package_count cannot be negative")

      print(f"Validated Cargo lockfile audit request for {repository}:{ref}")

  - id: fetch_manifest
    type: io.kestra.plugin.core.http.Request
    description: Read Cargo.toml from the selected public GitHub ref.
    uri: "https://raw.githubusercontent.com/{{ inputs.repository }}/{{ inputs.default_branch }}/{{ inputs.manifest_path }}"
    method: GET
    headers:
      User-Agent: Kestra-Cargo-Lockfile-Integrity-Gate/1.0
      Accept: text/plain
    timeout: PT30S

  - id: fetch_lockfile
    type: io.kestra.plugin.core.http.Request
    description: Read Cargo.lock from the same GitHub ref so both files are evaluated from one repository revision.
    uri: "https://raw.githubusercontent.com/{{ inputs.repository }}/{{ inputs.default_branch }}/{{ inputs.lockfile_path }}"
    method: GET
    headers:
      User-Agent: Kestra-Cargo-Lockfile-Integrity-Gate/1.0
      Accept: text/plain
    timeout: PT30S

  - id: audit_cargo_lockfile
    type: io.kestra.plugin.scripts.python.Script
    description: Parse TOML, compare the root package with Cargo.toml, require registry checksums, flag insecure registry sources and enforce immutable Git dependency pins.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    inputFiles:
      Cargo.toml: "{{ outputs.fetch_manifest.body }}"
      Cargo.lock: "{{ outputs.fetch_lockfile.body }}"
    env:
      REPOSITORY: "{{ inputs.repository }}"
      MANIFEST_PATH: "{{ inputs.manifest_path }}"
      LOCKFILE_PATH: "{{ inputs.lockfile_path }}"
      MINIMUM_LOCKFILE_VERSION: "{{ inputs.minimum_lockfile_version }}"
      REQUIRE_REGISTRY_CHECKSUMS: "{{ inputs.require_registry_checksums }}"
      REQUIRE_HTTPS_REGISTRY: "{{ inputs.require_https_registry }}"
      REQUIRE_IMMUTABLE_GIT: "{{ inputs.require_immutable_git_refs }}"
      MINIMUM_PACKAGE_COUNT: "{{ inputs.minimum_package_count }}"
    outputFiles:
      - cargo-lockfile-audit.json
    script: |
      import json
      import os
      import re
      import tomllib
      from collections import Counter
      from datetime import datetime, timezone

      from kestra import Kestra

      repository = os.environ["REPOSITORY"].strip()
      manifest_path = os.environ["MANIFEST_PATH"].strip()
      lockfile_path = os.environ["LOCKFILE_PATH"].strip()
      minimum_lockfile_version = int(os.environ.get("MINIMUM_LOCKFILE_VERSION", "3"))
      require_checksums = os.environ.get("REQUIRE_REGISTRY_CHECKSUMS", "true").lower() == "true"
      require_https = os.environ.get("REQUIRE_HTTPS_REGISTRY", "true").lower() == "true"
      require_immutable_git = os.environ.get("REQUIRE_IMMUTABLE_GIT", "true").lower() == "true"
      minimum_package_count = int(os.environ.get("MINIMUM_PACKAGE_COUNT", "1"))

      with open("Cargo.toml", "rb") as source:
          manifest = tomllib.load(source)
      with open("Cargo.lock", "rb") as source:
          lockfile = tomllib.load(source)

      if not isinstance(manifest, dict) or not isinstance(lockfile, dict):
          raise ValueError("Cargo.toml and Cargo.lock must parse to TOML tables")
      lock_version = lockfile.get("version")
      if not isinstance(lock_version, int):
          raise ValueError("Cargo.lock must contain an integer format version")
      package_records = lockfile.get("package")
      if not isinstance(package_records, list):
          raise ValueError("Cargo.lock must contain package records")

      manifest_package = manifest.get("package") or {}
      manifest_name = manifest_package.get("name")
      manifest_version = manifest_package.get("version")
      findings = []
      def add(code, severity, message, package=None):
          findings.append({"code": code, "severity": severity, "package": package, "message": message})

      if lock_version < minimum_lockfile_version:
          add("LOCKFILE_VERSION_TOO_OLD", "BLOCK", f"Cargo.lock format {lock_version} is below the configured minimum {minimum_lockfile_version}.")
      if len(package_records) < minimum_package_count:
          add("PACKAGE_COUNT_BELOW_MINIMUM", "BLOCK", f"Cargo.lock contains {len(package_records)} package records, below minimum {minimum_package_count}.")

      if manifest_name and manifest_version:
          root_matches = [
              package for package in package_records
              if package.get("name") == manifest_name
              and package.get("version") == manifest_version
              and not package.get("source")
          ]
          if not root_matches:
              add("ROOT_PACKAGE_MISSING_FROM_LOCK", "BLOCK", f"Cargo.lock has no source-less root package matching {manifest_name}@{manifest_version} from Cargo.toml.")

      source_re = re.compile(r"^(?:git\+|git://)", re.IGNORECASE)
      immutable_git_re = re.compile(r"#(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$")
      checksum_re = re.compile(r"^[0-9a-fA-F]{64}$")
      identities = []
      missing_checksums = []
      malformed_checksums = []
      insecure_sources = []
      mutable_git_sources = []
      registry_count = 0
      git_count = 0
      for package in package_records:
          if not isinstance(package, dict):
              add("PACKAGE_RECORD_INVALID", "BLOCK", "Cargo.lock contains a package entry that is not a table.")
              continue
          name = str(package.get("name") or "").strip()
          version = str(package.get("version") or "").strip()
          source = str(package.get("source") or "").strip()
          checksum = str(package.get("checksum") or "").strip()
          if not name or not version:
              add("PACKAGE_IDENTITY_MISSING", "BLOCK", "A Cargo.lock package entry has no name or version.", name or None)
              continue
          identities.append((name, version, source))
          if source.startswith("registry+"):
              registry_count += 1
              if require_https and not source.startswith("registry+https://"):
                  insecure_sources.append({"package": name, "version": version, "source": source})
                  add("INSECURE_REGISTRY_SOURCE", "BLOCK", f"Registry package source is not HTTPS: {source}", name)
              if require_checksums and not checksum:
                  missing_checksums.append(f"{name}@{version}")
                  add("REGISTRY_CHECKSUM_MISSING", "BLOCK", f"Registry package {name}@{version} has no checksum.", name)
              elif checksum and not checksum_re.fullmatch(checksum):
                  malformed_checksums.append(f"{name}@{version}")
                  add("REGISTRY_CHECKSUM_MALFORMED", "BLOCK", f"Registry package {name}@{version} has a checksum that is not 64 hexadecimal characters.", name)
          elif source_re.match(source):
              git_count += 1
              if require_immutable_git and not immutable_git_re.search(source):
                  mutable_git_sources.append({"package": name, "version": version, "source": source})
                  add("GIT_SOURCE_NOT_IMMUTABLE", "BLOCK", f"Git package {name}@{version} is not pinned to a full commit SHA.", name)
          elif source and source.lower().startswith("registry+http://"):
              insecure_sources.append({"package": name, "version": version, "source": source})
              add("INSECURE_REGISTRY_SOURCE", "BLOCK", f"Registry source uses cleartext HTTP: {source}", name)

      identity_counts = Counter(identities)
      duplicated_identities = [
          {"name": name, "version": version, "source": source, "count": count}
          for (name, version, source), count in identity_counts.items() if count > 1
      ]
      for duplicate in duplicated_identities:
          add("DUPLICATE_PACKAGE_IDENTITY", "WARN", f"Package identity appears more than once: {duplicate['name']}@{duplicate['version']}.", duplicate["name"])

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "repository": repository,
          "manifestPath": manifest_path,
          "lockfilePath": lockfile_path,
          "manifestPackage": {"name": manifest_name, "version": manifest_version},
          "lockfileVersion": lock_version,
          "minimumLockfileVersion": minimum_lockfile_version,
          "packageRecordCount": len(package_records),
          "registryPackageCount": registry_count,
          "gitPackageCount": git_count,
          "missingChecksums": missing_checksums,
          "malformedChecksums": malformed_checksums,
          "insecureRegistrySources": insecure_sources,
          "mutableGitSources": mutable_git_sources,
          "duplicatePackageIdentities": duplicated_identities,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "The audit validates Cargo.lock metadata and declared checksums; it does not download crate archives or recompute their content hashes.",
      }
      with open("cargo-lockfile-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"Cargo lockfile integrity audit: {repository} verdict={verdict}; packages={len(package_records)}, registry={registry_count}, git={git_count}, blocking={len(blocking)}")
      Kestra.outputs({
          "repository": repository,
          "manifest_path": manifest_path,
          "lockfile_path": lockfile_path,
          "manifest_package_name": manifest_name or "",
          "manifest_package_version": manifest_version or "",
          "lockfile_version": lock_version,
          "package_record_count": len(package_records),
          "registry_package_count": registry_count,
          "git_package_count": git_count,
          "missing_checksum_count": len(missing_checksums),
          "malformed_checksum_count": len(malformed_checksums),
          "insecure_source_count": len(insecure_sources),
          "mutable_git_source_count": len(mutable_git_sources),
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "findings": findings,
          "verdict": verdict,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the JSON lockfile report in S3 for release evidence.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_cargo_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Archive the generated audit report without copying crate archives.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_cargo_lockfile.outputFiles['cargo-lockfile-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.repository | replace('/', '_') }}/cargo-lockfile-audit.json"

  - id: enforce_cargo_lock_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when checksum, source URL, lockfile format or immutable Git reference policies fail.
    condition: "{{ outputs.audit_cargo_lockfile.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_blocked_cargo_lock
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert maintainers when a Cargo lockfile violates dependency supply-chain policy.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":rotating_light: Cargo lockfile integrity gate BLOCKED\\nRepository: " ~ outputs.audit_cargo_lockfile.vars.repository ~
                "\\nLockfile version: " ~ outputs.audit_cargo_lockfile.vars.lockfile_version ~
                "\\nFindings: " ~ (outputs.audit_cargo_lockfile.vars.findings | toJson) ~
                "\\nExecution: " ~ execution.id ~
                "\\nReview cargo-lockfile-audit.json for details."
            } | toJson
          }}
      - id: fail_cargo_lock_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Block downstream builds or releases when lockfile integrity requirements fail.
        errorMessage: "Cargo lockfile integrity policy failed for {{ outputs.audit_cargo_lockfile.vars.repository }}. Review cargo-lockfile-audit.json."
    else:
      - id: log_cargo_lock_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Cargo lockfile audit {{ outputs.audit_cargo_lockfile.vars.verdict }} for {{ outputs.audit_cargo_lockfile.vars.repository }}; packages={{ outputs.audit_cargo_lockfile.vars.package_record_count }}, blocking={{ outputs.audit_cargo_lockfile.vars.blocking_finding_count }}."

errors:
  - id: alert_cargo_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when fetching, parsing or evaluating a Cargo lockfile fails so orchestration errors are not mistaken for a passing result.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{
        {
          "text": ":warning: Cargo lockfile audit execution failed\\nRepository: " ~ inputs.repository ~
            "\\nExecution: " ~ execution.id ~
            "\\nInspect Kestra logs; API and parsing failures must not be interpreted as PASS."
        } | toJson
      }}

outputs:
  - id: cargo_lock_audit
    type: JSON
    description: Machine-readable lockfile version, package counts, checksum findings and immutable source policy verdict.
    value: "{{ outputs.audit_cargo_lockfile.vars | toJson }}"

extend:
  title: Rust Cargo Lockfile Integrity Gate
  metaTitle: Rust Cargo Lockfile Integrity Gate | Kestra
  shortDescription: Audit Cargo.toml and Cargo.lock consistency, registry checksum coverage, secure registry sources and immutable Git dependency pins before building Rust software.
  metaDescription: Gate Rust releases on Cargo lockfile format, root package consistency, SHA-256 registry checksums, HTTPS registry sources and immutable Git revisions.
  description: |
    Check a public Rust repository's manifest and Cargo.lock before building or promoting a release. The workflow compares the root package metadata, verifies the lockfile format and package records, checks that registry-sourced packages include correctly shaped SHA-256 checksums, and requires Git-sourced dependencies to use a full commit hash. It writes machine-readable evidence, supports optional S3 archival, and fails when configured supply-chain policy checks fail.

    ## How it works

    1. Validate the repository, ref, manifest and lockfile paths, and the minimum policy thresholds.
    2. Fetch Cargo.toml and Cargo.lock from the same public GitHub ref.
    3. Parse both TOML files and verify the package name and version match a source-less root package in the lockfile.
    4. Inspect every lockfile package record for registry checksum presence and shape, HTTPS registry sources, and immutable Git dependency revisions.
    5. Optionally archive the report to S3, then route blocking results to Slack and a failing task.

    ## What you get

    - A JSON report listing lockfile format, package counts, registry source coverage, and immutable Git references.
    - Detection of registry-sourced packages with missing or malformed checksums.
    - Detection of cleartext registry sources and Git dependencies not pinned to a full commit SHA.
    - Optional S3 evidence retention and a fail-closed release path.

    ## Who it's for

    - Rust maintainers checking dependency changes before release.
    - Platform teams standardizing build input and dependency-integrity controls.
    - Supply-chain security engineers maintaining evidence for source and dependency policy.

    ## Why orchestrate this with Kestra

    Kestra provides a reproducible two-file fetch, structured audit, optional archival, and a recorded failure state so downstream build and release workflows can depend on explicit policy results.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access to raw.githubusercontent.com.
    - A Slack incoming webhook for blocking alerts; S3 archival is optional.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for a blocked policy result or execution error.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow with repository BurntSushi/ripgrep, branch master and the default Cargo.toml and Cargo.lock paths.
    2. Execute manually and inspect cargo-lockfile-audit.json and the cargo_lock_audit output.
    3. Set minimum_lockfile_version, require_registry_checksums, require_https_registry and require_immutable_git_refs to match the project policy.
    4. Configure Slack before relying on blocking notifications.
    5. Enable weekly_cargo_lockfile_audit after reviewing the first report and configuring any optional S3 bucket.

    ## How to extend

    - Download and hash crate archives to confirm the bytes match the lockfile checksums.
    - Compare the root manifest dependency specifications with resolved lockfile package records.
    - Add an allowlist for trusted custom registries or Git hosts.
    - Require a passing lockfile audit before downstream package publishing or binary builds.

    ## Links

    - [Cargo lockfile reference](https://doc.rust-lang.org/cargo/guide/cargo-toml-vs-cargo-lock.html)
    - [Cargo dependency specification](https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html)
    - [GitHub raw file access](https://docs.github.com/en/repositories/working-with-files/using-files/getting-permanent-links-to-files)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
