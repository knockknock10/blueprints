id: cors-preflight-policy-compliance-gate
namespace: company.infrastructure
description: |
  Execute a real browser-style CORS preflight request against an HTTPS endpoint and
  compare the returned policy headers with an application's origin, requested method,
  headers, and credential requirements. The flow writes a machine-readable evidence
  report and fails closed when the server's CORS response does not satisfy the declared
  policy. It does not infer browser behavior from a normal GET response.

inputs:
  - id: target_url
    type: STRING
    displayName: Target HTTPS URL
    defaults: https://api.github.com/
    description: HTTPS resource URL whose server handles preflight requests.
  - id: expected_origin
    type: STRING
    displayName: Application origin
    defaults: https://example.com
    description: Origin value to send in the preflight request and compare with allow-origin.
  - id: request_method
    type: STRING
    displayName: Requested cross-origin method
    defaults: GET
    description: HTTP method to place in Access-Control-Request-Method.
  - id: request_headers
    type: STRING
    displayName: Requested non-simple headers
    defaults: authorization,content-type
    description: Comma-separated headers to send in Access-Control-Request-Headers. Leave empty when no non-simple headers are needed.
  - id: allow_wildcard_origin
    type: BOOL
    displayName: Allow wildcard origin
    defaults: true
    description: Accept Access-Control-Allow-Origin star only when credentials are not required.
  - id: credentials_expected
    type: BOOL
    displayName: Require credentialed CORS
    defaults: false
    description: Require Access-Control-Allow-Credentials true and reject wildcard allow-origin.
  - id: minimum_max_age_seconds
    type: INT
    displayName: Minimum preflight cache age
    defaults: 0
    description: Optional minimum Access-Control-Max-Age. Zero disables this check.
  - id: notify_slack
    type: BOOL
    displayName: Send Slack alerts
    defaults: false
    description: Enable only after configuring SLACK_WEBHOOK_URL in the Kestra namespace.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON report in an S3 bucket. AWS credentials are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: S3 evidence bucket
    defaults: my-cors-audit-evidence
    description: Existing S3 bucket used only when report archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: S3 evidence prefix
    defaults: cors-preflight-audits
    description: Prefix for domain and endpoint audit reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region containing the evidence bucket.

triggers:
  - id: cors_policy_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck the endpoint's CORS preflight policy every weekday. Enable after reviewing the endpoint and configuring any alert or archival integrations.
    cron: "0 10 * * 1-5"
    disabled: true

tasks:
  - id: validate_configuration
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the target, application origin, method and policy inputs before sending a network request.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      TARGET_URL: "{{ inputs.target_url }}"
      EXPECTED_ORIGIN: "{{ inputs.expected_origin }}"
      REQUEST_METHOD: "{{ inputs.request_method }}"
      REQUEST_HEADERS: "{{ inputs.request_headers }}"
      MINIMUM_MAX_AGE: "{{ inputs.minimum_max_age_seconds }}"
    script: |
      import os
      import re
      from urllib.parse import urlsplit

      target = urlsplit(os.environ.get("TARGET_URL", "").strip())
      origin = urlsplit(os.environ.get("EXPECTED_ORIGIN", "").strip())
      method = os.environ.get("REQUEST_METHOD", "").strip().upper()
      requested_headers = [h.strip().lower() for h in os.environ.get("REQUEST_HEADERS", "").split(",") if h.strip()]
      try:
          minimum_max_age = int(os.environ.get("MINIMUM_MAX_AGE", "0"))
      except ValueError as exc:
          raise ValueError("minimum_max_age_seconds must be an integer") from exc

      if target.scheme != "https" or not target.hostname or target.username or target.password:
          raise ValueError("target_url must be an HTTPS URL without embedded credentials")
      if target.query or target.fragment:
          raise ValueError("target_url must not contain query parameters or fragments; include them only if your service requires them and you have reviewed the exposure")
      if origin.scheme not in {"http", "https"} or not origin.hostname or origin.username or origin.password or origin.path not in {"", "/"} or origin.query or origin.fragment:
          raise ValueError("expected_origin must be an HTTP(S) origin without credentials, path, query or fragment")
      if not re.fullmatch(r"[A-Z][A-Z0-9!#$%&'*+.^_`|~-]*", method):
          raise ValueError("request_method must be a valid HTTP token")
      if minimum_max_age < 0:
          raise ValueError("minimum_max_age_seconds cannot be negative")
      if any(not re.fullmatch(r"[a-z0-9!#$%&'*+.^_`|~-]+", name) for name in requested_headers):
          raise ValueError("request_headers must be comma-separated HTTP header names")
      if len(set(requested_headers)) != len(requested_headers):
          raise ValueError("request_headers contains duplicates")

      print(f"Validated HTTPS CORS preflight target={target.scheme}://{target.netloc}; origin={origin.scheme}://{origin.netloc}; method={method}; requested headers={len(requested_headers)}")

  - id: audit_cors_preflight
    type: io.kestra.plugin.scripts.python.Script
    description: Send an actual OPTIONS preflight request and evaluate CORS response headers. The target must be a service that responds to OPTIONS for the configured URL.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    env:
      TARGET_URL: "{{ inputs.target_url }}"
      EXPECTED_ORIGIN: "{{ inputs.expected_origin }}"
      REQUEST_METHOD: "{{ inputs.request_method }}"
      REQUEST_HEADERS: "{{ inputs.request_headers }}"
      ALLOW_WILDCARD_ORIGIN: "{{ inputs.allow_wildcard_origin }}"
      CREDENTIALS_EXPECTED: "{{ inputs.credentials_expected }}"
      MINIMUM_MAX_AGE: "{{ inputs.minimum_max_age_seconds }}"
    outputFiles:
      - cors-preflight-report.json
    script: |
      import json
      import os
      from datetime import datetime, timezone
      from urllib.error import HTTPError, URLError
      from urllib.request import Request, urlopen

      from kestra import Kestra

      target_url = os.environ["TARGET_URL"].strip()
      expected_origin = os.environ["EXPECTED_ORIGIN"].strip().rstrip("/")
      requested_method = os.environ["REQUEST_METHOD"].strip().upper()
      requested_headers = sorted({h.strip().lower() for h in os.environ.get("REQUEST_HEADERS", "").split(",") if h.strip()})
      allow_wildcard_origin = os.environ.get("ALLOW_WILDCARD_ORIGIN", "true").lower() == "true"
      credentials_expected = os.environ.get("CREDENTIALS_EXPECTED", "false").lower() == "true"
      minimum_max_age = int(os.environ.get("MINIMUM_MAX_AGE", "0"))

      findings = []
      checks = []

      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      request_headers = {
          "Origin": expected_origin,
          "Access-Control-Request-Method": requested_method,
          "User-Agent": "Kestra-CORS-Preflight-Policy-Gate/1.0",
      }
      if requested_headers:
          request_headers["Access-Control-Request-Headers"] = ", ".join(requested_headers)

      req = Request(target_url, method="OPTIONS", headers=request_headers)
      response_status = None
      response_headers = {}
      response_body_excerpt = ""
      try:
          with urlopen(req, timeout=30) as response:
              response_status = response.status
              response_headers = {k.lower(): v.strip() for k, v in response.headers.items()}
              response_body_excerpt = response.read(2048).decode("utf-8", "replace")
      except HTTPError as exc:
          response_status = exc.code
          response_headers = {k.lower(): v.strip() for k, v in exc.headers.items()}
          try:
              response_body_excerpt = exc.read(2048).decode("utf-8", "replace")
          except Exception:
              response_body_excerpt = ""
      except (URLError, TimeoutError, OSError) as exc:
          add("PREFLIGHT_REQUEST_FAILED", "BLOCK", f"OPTIONS request failed: {exc}")

      if response_status is not None:
          if response_status < 200 or response_status >= 300:
              add("PREFLIGHT_STATUS_NOT_SUCCESSFUL", "BLOCK", f"OPTIONS returned HTTP {response_status}, expected a 2xx response.")
          allow_origin = response_headers.get("access-control-allow-origin", "").strip()
          allow_methods = {item.strip().upper() for item in response_headers.get("access-control-allow-methods", "").split(",") if item.strip()}
          allow_headers = {item.strip().lower() for item in response_headers.get("access-control-allow-headers", "").split(",") if item.strip()}
          allow_credentials = response_headers.get("access-control-allow-credentials", "").strip().lower()
          max_age_raw = response_headers.get("access-control-max-age", "").strip()

          if not allow_origin:
              add("ALLOW_ORIGIN_MISSING", "BLOCK", "Response has no Access-Control-Allow-Origin header.")
          elif allow_origin == "*":
              if not allow_wildcard_origin:
                  add("WILDCARD_ORIGIN_DISALLOWED", "BLOCK", "Access-Control-Allow-Origin is wildcard but policy disallows wildcard origins.")
              if credentials_expected:
                  add("WILDCARD_ORIGIN_WITH_CREDENTIALS", "BLOCK", "Wildcard Access-Control-Allow-Origin is not valid for credentialed CORS.")
          elif allow_origin.rstrip("/") != expected_origin:
              add("ALLOW_ORIGIN_MISMATCH", "BLOCK", f"Access-Control-Allow-Origin is {allow_origin!r}, not the expected origin {expected_origin!r}.")

          if requested_method not in allow_methods and "*" not in allow_methods:
              add("REQUESTED_METHOD_NOT_ALLOWED", "BLOCK", f"Access-Control-Allow-Methods does not include {requested_method}.")
          missing_headers = [name for name in requested_headers if name not in allow_headers and "*" not in allow_headers]
          if missing_headers:
              add("REQUESTED_HEADERS_NOT_ALLOWED", "BLOCK", "Access-Control-Allow-Headers omits: " + ", ".join(missing_headers))
          if credentials_expected and allow_credentials != "true":
              add("CREDENTIALS_NOT_ALLOWED", "BLOCK", "Credentialed CORS is required but Access-Control-Allow-Credentials is not true.")

          max_age = None
          if max_age_raw:
              try:
                  max_age = int(max_age_raw)
                  if max_age < 0:
                      raise ValueError("negative max age")
              except ValueError:
                  add("MAX_AGE_INVALID", "WARN", f"Access-Control-Max-Age is not a non-negative integer: {max_age_raw!r}")
          if minimum_max_age and (max_age is None or max_age < minimum_max_age):
              add("MAX_AGE_BELOW_MINIMUM", "BLOCK", f"Access-Control-Max-Age is {max_age}; policy requires at least {minimum_max_age} seconds.")

          checks = [
              {"name": "http_status", "observed": response_status, "pass": 200 <= response_status < 300},
              {"name": "allow_origin", "observed": allow_origin, "expected": expected_origin},
              {"name": "allow_methods", "observed": sorted(allow_methods), "requested": requested_method},
              {"name": "allow_headers", "observed": sorted(allow_headers), "requested": requested_headers},
              {"name": "allow_credentials", "observed": allow_credentials or None, "required": credentials_expected},
              {"name": "max_age", "observed": max_age, "minimum": minimum_max_age},
          ]

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "targetUrl": target_url,
          "expectedOrigin": expected_origin,
          "requestedMethod": requested_method,
          "requestedHeaders": requested_headers,
          "responseStatus": response_status,
          "responseHeaders": response_headers,
          "checks": checks,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This is a direct HTTP OPTIONS preflight inspection. Browser-specific credential modes, private-network-access rules, redirects and actual browser enforcement can differ. It does not send cookies, authorization credentials or follow-up application requests.",
          "responseBodyExcerpt": response_body_excerpt[:1000],
      }
      with open("cors-preflight-report.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"CORS preflight audit: target={target_url}, status={response_status}, verdict={verdict}, blocking={len(blocking)}, warnings={len(warnings)}")
      print("CORS policy findings: " + json.dumps(findings, ensure_ascii=False))
      Kestra.outputs({
          "target_url": target_url,
          "expected_origin": expected_origin,
          "response_status": response_status,
          "allow_origin": response_headers.get("access-control-allow-origin", ""),
          "allow_methods": response_headers.get("access-control-allow-methods", ""),
          "allow_headers": response_headers.get("access-control-allow-headers", ""),
          "allow_credentials": response_headers.get("access-control-allow-credentials", ""),
          "max_age_seconds": max_age,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the CORS report to S3 for compliance evidence.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_cors_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Store the JSON preflight evidence report in the configured bucket.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_cors_preflight.outputFiles['cors-preflight-report.json'] }}"
        key: "{{ inputs.evidence_prefix }}/cors-preflight-{{ execution.id }}.json"

  - id: enforce_cors_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when the requested origin, method, headers, credentials or max-age policy is not satisfied.
    condition: "{{ outputs.audit_cors_preflight.vars.verdict == 'FAIL' }}"
    then:
      - id: optionally_alert_cors_failure
        type: io.kestra.plugin.core.flow.If
        description: Send an alert only when enabled and the webhook secret is configured.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_cors_failure
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Alert the service owner with blocking CORS findings.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |-
              {{
                {
                  "text": ":warning: CORS preflight policy BLOCKED\nTarget: " ~ inputs.target_url ~
                    "\nOrigin: " ~ inputs.expected_origin ~
                    "\nFindings: " ~ (outputs.audit_cors_preflight.vars.findings | toJson) ~
                    "\nExecution: " ~ execution.id ~
                    "\nReview cors-preflight-report.json before relying on cross-origin requests."
                } | toJson
              }}
      - id: fail_cors_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop downstream workflows after a blocking CORS policy result.
        errorMessage: "CORS preflight policy failed for {{ inputs.target_url }}. Review cors-preflight-report.json."
    else:
      - id: log_cors_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "CORS preflight policy {{ outputs.audit_cors_preflight.vars.verdict }} for {{ inputs.target_url }}; allow-origin={{ outputs.audit_cors_preflight.vars.allow_origin }}."

errors:
  - id: optionally_alert_execution_failure
    type: io.kestra.plugin.core.flow.If
    description: Send technical execution failure notifications only when enabled.
    condition: "{{ inputs.notify_slack }}"
    then:
      - id: alert_execution_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert when network, parsing, or orchestration failures prevent an audit.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":warning: CORS preflight audit execution failed\nTarget: " ~ inputs.target_url ~
                "\nExecution: " ~ execution.id ~
                "\nInspect Kestra logs; an execution failure is not a passing CORS result."
            } | toJson
          }}

outputs:
  - id: cors_policy_audit
    type: JSON
    description: Machine-readable preflight status, CORS response headers, policy checks, findings and verdict.
    value: "{{ outputs.audit_cors_preflight.vars | toJson }}"

extend:
  title: CORS Preflight Policy Compliance Gate
  metaTitle: CORS Preflight Policy Compliance Gate | Kestra
  shortDescription: Send a real OPTIONS preflight request and gate a service on its CORS origin, methods, requested headers and credential policy.
  metaDescription: Test live CORS preflight headers against an application's origin, methods, request headers, credentials and max-age policy before release.
  description: |
    Verify cross-origin resource sharing (CORS) by sending an actual HTTP OPTIONS preflight request to a configured HTTPS endpoint. The flow compares the endpoint's returned allow-origin, allow-methods, allow-headers, optional credentials support and optional preflight cache age against explicit policy inputs. It writes a JSON report, optionally archives evidence to S3, can notify Slack, and fails when blocking policy violations are observed.

    ## How it works

    1. Validate the HTTPS target URL, application origin, HTTP method, request headers and numeric policy thresholds.
    2. Send an OPTIONS request with Origin, Access-Control-Request-Method and optional Access-Control-Request-Headers.
    3. Evaluate the actual HTTP status and Access-Control-Allow-* response headers, then write a machine-readable JSON report.
    4. Optionally archive the report to S3.
    5. Route a blocking verdict to an optional Slack alert and a failing task, or log the accepted policy.

    ## What you get

    - An evidence report with the observed status, relevant response headers and per-rule findings.
    - Detection of absent/mismatched allowed origins, methods and requested headers.
    - Checks for unsafe wildcard-origin plus credential requirements.
    - Optional minimum Access-Control-Max-Age enforcement, S3 evidence and Slack alerting.
    - A fail-closed result that downstream deployment flows can require.

    ## Who it's for

    - Frontend and API teams validating cross-origin access before deployment.
    - Security engineers reviewing browser-facing API policy.
    - Platform teams comparing production and preview environment CORS settings.

    ## Why orchestrate this with Kestra

    Kestra makes each CORS check repeatable, parametrized and observable, retains report output with the execution, and gives downstream delivery workflows a clear success/failure policy gate rather than an unlogged curl command.

    ## Prerequisites

    - Kestra 2.x workers with Docker enabled for the Python Script task runner.
    - Worker network access to the configured HTTPS endpoint.
    - Optional Slack incoming webhook and optional S3 bucket with write access.
    - An approved application origin, requested method and non-simple headers derived from the actual application's use case.

    ### Secrets

    - SLACK_WEBHOOK_URL: optional Slack incoming webhook; required only when notify_slack is true.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow and leave target_url as https://api.github.com/ for a public default endpoint.
    2. Replace expected_origin with the exact scheme/host/port origin of your frontend.
    3. Set request_method and request_headers to match the browser request that should be permitted.
    4. Execute the flow and inspect the cors_policy_audit output and cors-preflight-report.json file.
    5. Enable the schedule only after confirming the policy is correct. Configure optional secrets before enabling Slack alerting or S3 archival.

    ## How to extend

    - Audit a list of application origins and required methods as separate executions.
    - Compare production, staging and preview APIs for CORS drift.
    - Add separate policies for public unauthenticated and credentialed endpoints.
    - Include response-header exposure and private-network-access policy checks for applications that require them.

    ## Links

    - [MDN CORS guide](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)
    - [MDN preflight request](https://developer.mozilla.org/en-US/docs/Glossary/Preflight_request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack Incoming Webhook plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
